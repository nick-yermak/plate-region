<div
  class="home"
  nz-flex
  nzVertical
  nzJustify="center"
  nzAlign="center"
  nzGap="middle"
>
  <h1>{{ 'home.title' | transloco }}</h1>
  <form nz-form class="pr-home-search" [formRoot]="searchForm">
    <nz-form-item>
      <nz-form-control nzDisableAutoTips [nzErrorTip]="errorTip">
        <div nz-flex nzVertical nzGap="small">
          <div class="search-row">
            <app-plate-input
              [formField]="searchForm"
              [label]="'home.plateNumber' | transloco"
              [describedBy]="describedBy()"
            />
            <button
              nz-button
              nzType="primary"
              nzSize="large"
              type="submit"
              class="search"
              [attr.aria-label]="'home.search' | transloco"
            >
              <span nz-icon nzType="search" nzTheme="outline"></span>
            </button>
          </div>
          <p class="hint" [id]="hintId">{{ 'home.hint' | transloco }}</p>
        </div>
      </nz-form-control>
    </nz-form-item>
  </form>
</div>
<ng-template #errorTip>
  @if (error(); as message) {
    <span [id]="errorId">{{ message.key | transloco: message.params }}</span>
  }
</ng-template>
