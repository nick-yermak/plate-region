<div nz-flex nzVertical nzGap="large">
  <div class="home-form" nz-flex nzVertical nzGap="middle" nzAlign="center">
    <h1>{{ 'home.title' | transloco }}</h1>
    <form nz-form [formRoot]="searchForm">
      <nz-form-item>
        <nz-form-control
          nzDisableAutoTips
          [nzErrorTip]="errorTip"
          [nzExtra]="hintTip"
        >
          <div class="plate-wrap">
            <app-plate-input
              [formField]="searchForm"
              [label]="'home.plateNumber' | transloco"
              [describedBy]="describedBy()"
            />
          </div>
        </nz-form-control>
      </nz-form-item>
      <button nz-button nzType="primary" type="submit">
        {{ 'home.search' | transloco }}
      </button>
    </form>
    <app-home-examples [examples]="examples" (pick)="pickExample($event)" />
  </div>
  @if (candidates(); as result) {
    <app-candidates-list [result]="result" [language]="language()" />
  }
</div>
<div class="cdk-visually-hidden" aria-live="polite">{{ announcement() }}</div>
<ng-template #errorTip>
  @if (error(); as message) {
    <span [id]="errorId">{{ message.key | transloco: message.params }}</span>
  }
</ng-template>
<ng-template #hintTip>
  <span [id]="hintId">{{ 'home.hint' | transloco }}</span>
</ng-template>
