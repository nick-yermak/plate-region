<div
  role="group"
  [attr.aria-labelledby]="labelId"
  nz-flex
  nzWrap="wrap"
  nzGap="small"
  nzAlign="center"
>
  <span [id]="labelId">{{ 'home.examples.label' | transloco }}</span>
  @for (example of examples(); track example) {
    <button
      nz-button
      type="button"
      class="example"
      (click)="pick.emit(example)"
    >
      {{ example }}
    </button>
  }
</div>
