<div
  role="group"
  [attr.aria-label]="'home.examples.label' | transloco"
  nz-flex
  nzWrap="wrap"
  nzGap="small"
  nzAlign="center"
>
  @for (example of examples(); track example) {
    <button
      nz-button
      type="button"
      class="example"
      (click)="pick.emit(example)"
    >
      {{ example }}
    </button>
  }
</div>
