<section>
  <h2>{{ heading().key | transloco: heading().params }}</h2>
  <ul>
    @for (entry of county().codes; track entry.code) {
      <li class="voivodeship-code-row" [id]="entry.code">
        <span>{{ entry.code }}</span>
        <app-plate [plate]="entry.plate" />
      </li>
    }
  </ul>
</section>
