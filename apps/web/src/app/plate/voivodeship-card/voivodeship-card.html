<span nz-icon nzType="info-circle" nzTheme="outline" aria-hidden="true"></span>
<h2>{{ heading().key | transloco: heading().params }}</h2>
<p class="main-codes-caption">
  {{ 'plate.voivodeshipCard.mainCodes' | transloco }}
</p>
<ul class="main-codes">
  @for (row of codes(); track row.code) {
    <li>
      <a
        class="main-codes-tag"
        [routerLink]="['/voivodeship', row.link.slug]"
        [fragment]="row.link.fragment"
        [attr.title]="row.name.key | transloco: row.name.params"
      >
        {{ row.code
        }}<span class="visually-hidden">
          —
          {{ row.name.key | transloco: row.name.params }}</span
        >
      </a>
    </li>
  }
</ul>
