<svg
  [attr.viewBox]="
    viewBox().x +
    ' ' +
    viewBox().y +
    ' ' +
    viewBox().width +
    ' ' +
    viewBox().height
  "
  preserveAspectRatio="xMidYMid slice"
  aria-hidden="true"
  focusable="false"
>
  <path class="region" [attr.d]="regionPath()" />
  <path class="county-borders" [attr.d]="countyBorders()" />
  <path class="borders" [attr.d]="borders()" />
</svg>
