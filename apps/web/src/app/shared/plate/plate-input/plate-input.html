<app-plate-frame>
  <input
    type="text"
    [attr.aria-label]="label()"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    [attr.aria-describedby]="describedBy() ?? null"
    [value]="value()"
    (input)="onInput($event)"
    autocomplete="off"
    autocapitalize="characters"
    spellcheck="false"
    enterkeyhint="search"
  />
</app-plate-frame>
