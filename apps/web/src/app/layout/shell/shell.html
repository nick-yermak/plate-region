<nz-layout>
  <app-header
    [links]="navLinks"
    [pending]="contentPending()"
    (menuOpen)="openDrawer()"
  >
    <app-language-switcher />
    <app-theme-switcher />
  </app-header>
  <nz-content role="main" [attr.aria-busy]="contentPending() ? true : null">
    @if (contentPending()) {
      <nz-skeleton-element
        class="pr-heading-skeleton"
        nzType="button"
        nzActive
        aria-hidden="true"
      />
    } @else {
      <router-outlet />
    }
  </nz-content>
</nz-layout>

@if (drawerPresent()) {
  <nz-drawer
    [nzVisible]="drawerVisible()"
    (nzOnClose)="requestDrawerClose()"
    (nzVisibleChange)="drawerVisible.set($event)"
  >
    <ng-container *nzDrawerContent>
      <app-nav-menu
        class="pr-drawer-nav"
        mode="inline"
        [links]="navLinks"
        [pending]="contentPending()"
        (linkSelect)="requestDrawerClose()"
      />
    </ng-container>
  </nz-drawer>
}
