<nz-header role="banner">
  <a class="header-brand" routerLink="/">
    <img src="/logo.svg" alt="Tablicomat" width="145" height="30" />
  </a>
  <app-nav-menu
    class="header-nav"
    mode="horizontal"
    [links]="links()"
    [pending]="pending()"
  />
  <div nz-flex nzAlign="center" nzGap="small" class="header-actions">
    <ng-content />
    <button
      nz-button
      nzType="default"
      type="button"
      class="header-burger"
      [attr.aria-label]="('layout.menu' | transloco) || null"
      (click)="menuOpen.emit()"
    >
      <nz-icon nzType="menu" nzTheme="outline" />
    </button>
  </div>
</nz-header>
