<nz-layout>
  <app-header
    [links]="navLinks"
    [pending]="contentPending()"
    (menuOpen)="drawerOpen.set(true)"
  >
    <app-language-switcher />
    <app-theme-switcher />
  </app-header>
  <nz-content role="main" [attr.aria-busy]="contentPending() ? true : null">
    @if (contentPending()) {
      <nz-skeleton-element
        class="pr-heading-skeleton"
        nzType="button"
        nzActive
        aria-hidden="true"
      />
    } @else {
      <router-outlet />
    }
  </nz-content>
</nz-layout>

<nz-drawer
  [nzVisible]="drawerOpen()"
  (nzOnClose)="drawerOpen.set(false)"
  (nzVisibleChange)="drawerOpen.set($event)"
>
  <ng-container *nzDrawerContent>
    <app-nav-menu
      mode="inline"
      [links]="navLinks"
      [pending]="contentPending()"
      (linkSelect)="drawerOpen.set(false)"
    />
  </ng-container>
</nz-drawer>
